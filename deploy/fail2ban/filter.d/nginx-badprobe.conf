# Fail2Ban filter: nginx-badprobe
# Place: /etc/fail2ban/filter.d/nginx-badprobe.conf
#
# Well-known attack paths in the nginx access log, whatever the status, so
# a probe the app answers with 200 ("/?file=../../etc/passwd") is caught
# too. Only attack strings, so real assets (/build/, /livewire) never match.
# Check after an edit:
#   sudo fail2ban-regex /var/log/nginx/access.log.1 \
#        /etc/fail2ban/filter.d/nginx-badprobe.conf
[Definition]
failregex = ^<HOST> -[^"]*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)\s[^"]*(?:/etc/passwd|/proc/self/environ|php://input|auto_prepend_file|/\.env|/\.git|/\.aws|/\.mcp\.json|aws/credentials|\.git-credentials|/actuator|/@fs/|/@vite/|/wp-content/|/wp-includes/|/wp-login|/wp-admin|xmlrpc\.php|/cgi-bin/|eval-stdin\.php|/vendor/phpunit)[^"]*"
ignoreregex =

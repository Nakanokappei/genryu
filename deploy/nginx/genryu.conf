# /etc/nginx/sites-available/genryu (linked from sites-enabled).
# The ssl_* lines were written by certbot; keep them when replacing the file.

# No version number in the Server header or on error pages.
server_tokens off;

# A request for any other name (a scanner asking by IP, a forged Host) gets no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    server_name technologywatch.tokyo www.technologywatch.tokyo;
    root /var/www/genryu/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    # Dotfiles (.env, .git; .well-known aside) and secret-looking files are not found.
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(env|log|sql|bak|old|orig|swp|dist)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/technologywatch.tokyo/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/technologywatch.tokyo/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.technologywatch.tokyo) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = technologywatch.tokyo) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name technologywatch.tokyo www.technologywatch.tokyo;
    return 404; # managed by Certbot
}

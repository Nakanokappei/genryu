[project]
name = "acquisition-agent"
version = "0.1.0"
description = "Claude Agent SDK sidecar for the Technology Watch acquisition platform (ADR-0001)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

# Not an installable package: Laravel runs `python -m acquisition_agent` with
# the worker directory as cwd, so the module is found on sys.path directly.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
